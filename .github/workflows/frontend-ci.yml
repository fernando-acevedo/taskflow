name: Frontend CI

on:
  pull_request:
    paths: ['frontend/**', 'docs/api/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'docs/api/**', '.github/workflows/frontend-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: API types are up to date
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Script tests
        run: npm run test:scripts

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
