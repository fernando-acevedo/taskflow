name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # The production build uses src/environments/environment.ts (only the development configuration
      # replaces it), so the API URL is written there at build time.
      - name: Set production apiUrl
        working-directory: frontend
        run: |
          if [ -z "$API_URL" ]; then echo "vars.API_URL is empty"; exit 1; fi
          printf "export const environment = {\n  production: true,\n  apiUrl: '%s',\n};\n" "${API_URL%/}" > src/environments/environment.ts
          cat src/environments/environment.ts

      - name: Build
        working-directory: frontend
        run: npm run build

      # SPA fallback and headers come from frontend/public/staticwebapp.config.json.
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: frontend/dist/frontend/browser
