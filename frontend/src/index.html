<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <script>
      // Applies the saved theme before Angular starts, to avoid a flash (ADR 0015). The key and the values must
      // match THEME_STORAGE_KEY / THEME_PREFERENCES in src/app/core/theme/theme.ts.
      (function () {
        var scheme = 'light dark';
        try {
          var saved = localStorage.getItem('taskflow.theme');
          if (saved === 'Light') scheme = 'light';
          else if (saved === 'Dark') scheme = 'dark';
        } catch (e) {}
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
